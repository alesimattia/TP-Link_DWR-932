
<!-- Current Network Status  here -->
<div id="tf1_networkStatus">
<div id="tf1_tmpl_network_information">
	<script id="networkInfoTemplate" type="text/x-dot-template">	
	<form name="tf1_frmInternetStatus" id="tf1_frmInternetStatus" action="" method="post">
		<input type="hidden" name="thispage" id="thispage" value="controlPannel.html" />
		<h3>{{=global_lang["internet_popup"]["current_netstatus"] || 'Current Network Status' }}</h3>
		<div class="popupContentDisplay">
			<div class="configStatusContent">
				<h4>{{=global_lang["internet_popup"]["cell_info"] || 'Cellular Information' }}</h4>
				<div class="configRow2">
					<label>{{=global_lang["internet_popup"]["netprovider"] || 'Network Provider' }}</label>
					{{ if(ui_config.Dyn_Status["up_5s"]["ipv4"]["status"] == "Connected") { }}
						{{var statuStr;}}
						{{ if ( it.signal_level == "0") { }}
							  {{statuStr="signal1";}}
						{{ } else if( it.signal_level == "1") { }}	  
							 {{statuStr="signal2";}}	
						{{ } else if( it.signal_level == "2") { }}	  
							 {{statuStr="signal3";}}	
						{{ } else if( it.signal_level == "3") { }}	  
							 {{statuStr="signal4";}}	
						{{ } else if( it.signal_level == "4") { }}	  
							 {{statuStr="signal5";}}	
						{{ } else { }}
							  {{statuStr="signal5";}}
						{{ } }}
					{{ } }}
					
					{{ if(ui_config.Dyn_Status["up_5s"]["ipv4"]["status"] == "Disconnected") { }}
					
						{{var statuStr;}}
						{{ if ( it.signal_level == "0") { }}
							  {{statuStr="signalGray1";}}
						{{ } else if( it.signal_level == "1") { }}	  
							 {{statuStr="signalGray2";}}	
						{{ } else if( it.signal_level == "2") { }}	  
							 {{statuStr="signalGray3";}}	
						{{ } else if( it.signal_level == "3") { }}	  
							 {{statuStr="signalGray4";}}	
						{{ } else if( it.signal_level == "4") { }}	  
							 {{statuStr="signalGray5";}}	
						{{ } else { }}
							  {{statuStr="signalGray6";}}
						{{ } }}
					
					{{ } }}
					
					{{ if ( it.operator_name == "Searching") { }}
						<p>
						{{=global_lang["cpsection"]["Searching"] || 'Searching' }}
						</p>  
						{{ } else if( it.operator_name == "No Service") { }}	  
						<p>
						{{=global_lang["cpsection"]["no_service"] || 'No Service' }}
						</p> 
						{{ } else if( it.operator_name == "PUK Lock status") { }}	  
						<p>
						{{=global_lang["cpsection"]["puk_lock"] || 'PUK Lock status' }}
						</p> 
						{{ } else if( it.operator_name == "PIN Lock status") { }}	  
						<p>
						{{=global_lang["cpsection"]["pin_lock"] || 'PIN Lock status' }}
						</p> 
						{{ } else { }}
						<p>
							   {{! it.operator_name || ui_config.Dyn_Status["up_5s"]["signal"]["modem"]["opname"]}}
						</p>
						{{ } }}	 
					<span class={{=statuStr}}></span>
					{{ if ( it.operator_name == "Searching" || it.operator_name == "No Service" || it.network_type == "" || it.operator_name == "NO SIM") { }}
									 <dl> 
									dBm
									</dl>
									{{ } else { }}
									 <dl> 
										   {{=it.signal_strength}}dBm
									</dl>
									{{ } }}
				</div>
				<div class="break2">
					&nbsp;
				</div>
				<div class="configRow2">
					{{var network_service;}}
					<label>{{=global_lang["internet_popup"]["nettype"] || 'Network Type' }}</label>
						{{if(it.network_type == "G" || it.network_type == "E") {}}
							{{network_service = "2G";}}
						{{ } else { }}	
							{{network_service = it.network_type;}}
						{{ } }}	
					<p>
						{{=global_disconnect_service || network_service}}
					</p>
				</div>
				<div class="break2">
					&nbsp;
				</div>
				<div class="configRow2">
					<label>{{=global_lang["internet_popup"]["cntime"] || 'Connection Time' }}</label>
					<p>
						 {{! it.connection_time || ""}}
					</p>
				</div>
				<div class="break2">
					&nbsp;
				</div>
				<h4>{{=global_lang["internet_popup"]["network_status"] || 'Network Status' }}</h4>
				<div class="configRow2">
					<label>{{=global_lang["internet_popup"]["ipAddress"] || 'IP Address (IPV4)' }}</label>
					<p>
						{{! it.ipAddr || ""}}
					</p>
				</div>
				<div class="break2">
					&nbsp;
				</div>
				<div class="configRow2">
					<label>{{=global_lang["internet_popup"]["avgdl"] || 'Total DL' }}</label>
					<p>
						{{=it.Average_DL}}
					</p>
				</div>
				<div class="break2">
					&nbsp;
				</div>
				<div class="configRow2">
					<label>{{=global_lang["internet_popup"]["avgul"] || 'Total UL' }}</label>
					<p>
						{{=it.Average_UL}}
					</p>
				</div>
				<div class="break2">
					&nbsp;
				</div>
			</div>
		</div>
	</form>
	</script>
	</div>
</div>

						<label>{{=global_lang["internet_popup"]["apn"] || 'APN' }}</label>

					<div class="break" id="break_networkType_div">

					<div class="configRow" id="tf1_apn_div">

						<input type="text" id="tf1_apn" name="apn" 
						value='{{! it["apn"]["APN_0"]["apn"] || "" }}' maxlength="32"/>

					<div class="break" id="break_apn_div">
						&nbsp;

					<div class="configRow" id="tf1_userName_div">

						<input type="text" id="tf1_userName"  maxLength="32" name="userName" value='{{! it["apn"]["APN_0"]["uname"] || "" }}' />
					</div>
					<div class="break" id="break_userName_div">
						&nbsp;
					</div>
					<div class="configRow" id="tf1_Password_div">
						<label>{{=global_lang["internet_popup"]["apn_pwd"] || 'Password' }}</label>
						<input type="password" id="tf1_Password" maxLength="32" name="Password" value='{{! it["apn"]["APN_0"]["passwd"] || "" }}' />
					</div>
					<div class="break" id="break_Password_div">
						&nbsp;
					</div>
                    <div class="configRow" id="tf1_apnMethod_div">
						<label>{{=global_lang["internet_popup"]["apn_method"] || 'APN Method' }}</label>
						<select size="1" id="tf1_apnAuth" >                       
					   		 <option {{ if (it["apn"]["APN_0"]["auth"] == "3"){ }} selected {{}}} value="3">{{=global_lang["internet_popup"]["pap&chap"] || 'Auto (PAP & CHAP)' }}</option>
							<option {{ if (it["apn"]["APN_0"]["auth"] == "1"){ }} selected {{}}} value="1">{{=global_lang["internet_popup"]["pap"] || 'PAP' }}</option>
							<option {{ if (it["apn"]["APN_0"]["auth"] == "2"){ }} selected {{}}} value="2">{{=global_lang["internet_popup"]["chap"] || 'CHAP' }}</option>
							<option {{ if (it["apn"]["APN_0"]["auth"] == "0"){ }} selected {{}}} value="0">{{=global_lang["internet_popup"]["None"] || 'None' }}</option>
                           
                        </select>
					</div>
					<div class="break" id="break_apnMethod_div">
						&nbsp;
					</div>
                     
					<div class="configRow" id="tf1_tablewrapper_div">
						<div id="tablewrapper">
							<div id="tableheader">
								<div class="search">

									<select id="pagedropdown" style="display:none;"></select>
									<input type="text" value="search" data-localize="common.search" id="query" onkeyup="sorter.search('query')" />
									<span class="details">
										<div>
											<span data-localize="common.records">Records</span>: <span id="startrecord"></span>-<span id="endrecord"></span> of <span id="totalrecords"></span>
										</div> </span>
									<div id="tablelocation">
										<div>
											<select onchange="sorter.size(this.value)" class="one">
												<option value="5">5</option>

							</div>
							<table cellpadding="0" cellspacing="0" border="0" id="tf1_simContactsTbl" class="tinytable">

										</td>
										<td>System</td>
										<td>Far EasTone</td>

<!-- Connection Settings Starts here -->
<div id="tf1_connectModeSettings">
	<div id="tf1_tmpl_cnmode_info"></div>
	<script id="cnmodeinfoTemplate" type="text/x-dot-template">
	<form name="frm_connetionModeSettings" id="tf1_frm_connetionModeSettings" action="cgi-action.html" method="post">
		<input type="hidden" name="thispage" id="thispage" value="index.html" />
		<h3>{{=global_lang["internet_popup"]["cnsettings"] || 'Connection Settings' }}</h3>
		<div class="configForm">
			<div class="configContent">
				<h4>{{=global_lang["internet_popup"]["cellularsettings"] || 'Cellular Settings' }}</h4>
				<div class="roundedBox">
					<div class="configRow">
						<label>{{=global_lang["internet_popup"]["precell"] || 'Preferred Cellular' }}</label>
						<select id="tf1_netPref">
							<option value="0" {{if(it["apn"]["COMMON"]["netpref_value"] == "0") { }} selected {{}}}>{{=global_lang["internet_popup"]["cn_auto"] || 'Auto' }}</option>
							<option value="6" {{if(it["apn"]["COMMON"]["netpref_value"] == "6") { }} selected {{}}}>{{=global_lang["internet_popup"]["cn_4g"] || '4G mode' }}</option>
							<option value="7" {{if(it["apn"]["COMMON"]["netpref_value"] == "7") { }} selected {{}}}>{{=global_lang["internet_popup"]["cn_3g"] || '3G mode' }}</option>
							<option value="8" {{if(it["apn"]["COMMON"]["netpref_value"] == "8") { }} selected {{}}}>{{=global_lang["internet_popup"]["cn_2g"] || '2G mode' }}</option>
						</select>
					</div>
					<div class="break">
						&nbsp;
					</div>
					<div class="configRow">
					{{var statuStr,statuVal;}}
					<label>{{=global_lang["internet_popup"]["dataroaming"] || 'Allow Data Roaming' }}</label>
        	     			{{if(it["apn"]["COMMON"]["roaming_conx"] == "1") { }}
								 {{statuStr="enable-disable-on";}}
								 {{statuVal="1";}}
                        	{{ } else { }}
								 {{statuStr="enable-disable-off";}}
								 {{statuVal="0";}}
							{{ } }}
					
						<a alt="" class="{{=statuStr}}"></a>
						<input type="hidden" value="{{=statuVal}}" id="tf1_autoRoaming" />
					</div>
					<div class="break">
						&nbsp;
					</div>
					<div class="configRow">
						<label>{{=global_lang["cpsection"]["cnmode"] || 'Connection Mode' }}</label>
						{{var statuStr1 = "connectTypeActive ",statuStr2 = "connectType ",statuVal=1;}}
						{{if(it["apn"]["COMMON"]["auto_conx"] == "0") { }}
								 {{statuStr1= statuStr2;}}								
								 {{statuStr2= "connectTypeActive ";}}
								 {{statuVal="0";}}
                      	{{ } }}
						<p class="connectionModeradio">
							<a class="{{=statuStr1}}intGrp4" alt="" id="tf1_intAlwaysConnect" onclick="internet_changeConnectionModeOne(1)" val="1"></a>
										{{=global_lang["internet_popup"]["always"] || 'Always' }}
						</p>
						<p class="connectionModeradio">
							<a class="{{=statuStr2}}intGrp4" alt="" id="tf1_intManualConnect" onclick="internet_changeConnectionModeOne(0)" val="0"></a>
							
							{{=global_lang["internet_popup"]["manual"] || 'Manual' }}
						</p>
						<input type="text" style="display:none" id="tf1_autoConnectionOnOff" value="{{=statuVal}}" />

					</div>
					<div class="break">
						&nbsp;
					</div>
					<div  class="configRow" id="tf1_manualRadioAlways">
						<p class="textBlock">
							{{=global_lang["internet_popup"]["alwayskeep"] || 'Always keep Internet connection.'}}
						</p>
					</div>
					<div  class="configRow"  style="display: none" id="tf1_manualRadioOnDemand">
						<p class="textBlock">
							Connect to Internet when clients accesses the Internet. Disconnect in minutes if there is no Internet access.
						</p>
						<div class="break">
							&nbsp;
						</div>
						<label>Minutes</label>
						<input type="text" class="one" />
					</div>
					<div style="display: none"  id="tf1_manualRadioManual">
						<p class="textBlock">
							{{=global_lang["internet_popup"]["manualcnne"] || 'Manually control your connection behavior.' }}
						</p>
						<div class="break">
							&nbsp;
						</div>
						<div class="configRow" style="line-height:25px;">							
							{{var statuStr,statuVal;}}
					 		<label>{{=global_lang["internet_popup"]["cnstatus"] || 'Connect / Disconnect manually' }}</label>
        	     			{{ if(ui_config.Dyn_Status["up_5s"]["ipv4"]["status"] == "Connected") { }}
								 {{statuStr="enable-disable-on";}}
								 {{statuVal="1";}}
                        	{{ } else { }}
								 {{statuStr="enable-disable-off";}}
								 {{statuVal="0";}}
							{{ } }}
						    
							<p>
								<a class="{{=statuStr}}" alt="" id="" style="float:right;"></a>
								<input type="hidden" id="tf1_modeConfig_connectDisconnect" value="{{=statuVal}}" />
							</p>
						</div>
					</div>

					<div class="break">
						&nbsp;
					</div>
				</div>
				<h4>Bande LTE e carrier aggregation</h4>
				<div class="roundedBox" id="cst_lteBand">
					<div class="configRow">
						<label>Bande abilitate</label>
						<p class="cstLbStato" style="width:300px;line-height:20px;padding-top:5px">lettura dal modem...</p>
					</div>
					<div class="break">&nbsp;</div>
					<div class="configRow">
						<label>Bande LTE</label>
						<p class="cstLbScelta" style="width:300px"></p>
					</div>
					<div class="break">&nbsp;</div>
					<div class="configRow">
						<label>Carrier aggregation</label>
						<p class="cstLbCa" style="width:300px;line-height:20px;padding-top:5px"></p>
					</div>
					<div class="break">&nbsp;</div>
					<div class="configRow">
						<label>&nbsp;</label>
						<p style="width:300px;font-size:12px;line-height:18px">La scelta resta salvata nel modem anche dopo il riavvio e vale con qualunque Cellulare preferito. Se nessuna delle bande scelte &egrave; coperta, il router resta senza 4G (con Automatico passa al 3G). La carrier aggregation non ha un interruttore: nel modem non risulta disattivata e la attiva la rete quando combina due bande abilitate; dal firmware non si vede se &egrave; in uso.</p>
					</div>
					<div class="break">&nbsp;</div>
					<div class="configRow">
						<label>&nbsp;</label>
						<p>
							<input type="button" value="Tutte" class="btnSubmit cstLbTutte" disabled>
							<input type="button" value="Applica bande" class="btnSubmit cstLbApplica" disabled>
						</p>
					</div>
				</div>
