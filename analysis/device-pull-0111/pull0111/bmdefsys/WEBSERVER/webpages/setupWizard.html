			<li id="list1">

		<!-- Screen One --->
		<div class="wizardFormStarts screen" id="tf1_ConnectionScreen">
			 <div class="setupConfig">

					<label>{{=global_lang["internet_popup"]["apnselemode"] || 'APN Selection Mode' }}</label>
					<select  name="apnMode" id="tf1_setup_apnMode" onchange="setup_apnModeChange()" >
						<option selected value="0" {{ if(it["apn"]["apn"]["APN_0"]["type"] == 0) { }} selected {{ } }}>{{=global_lang["internet_popup"]["apn_auto"] || 'Auto' }}</option>
						<option value="1" {{ if(it["apn"]["apn"]["APN_0"]["type"] == 1) { }} selected {{ } }}>{{=global_lang["internet_popup"]["apn_manual"] || 'Manual' }}</option>
					</select>
				</div>
				<div class="break">
					&nbsp;
				</div>

				<div class="configRow">
					{{var statuStr,statuVal;}}

						 {{statuStr="enable-disable-on";}}
						 {{statuVal="1";}}
                    {{ } else { }}
						 {{statuStr="enable-disable-off";}}
						 {{statuVal="0";}}
					{{ } }}
					<a alt="" class="{{=statuStr}}" id=""></a>
					<input type="hidden" value="{{=statuVal}}" name="" id="tf1_allowroaming_cpwizard">
				</div>
				<div class="break">
					&nbsp;
				</div>
				<div class="configRow" id="tf1_setup_apnAuto_div">
					<label>{{=global_lang["internet_popup"]["apn"] || 'APN' }}</label>
					<select id="tf1_setup_apnAuto" onchange="setup_AutoApnChange()">
						{{ var apnRecords = it["apn"]["apn_list"]["multi_apn0"];}}
							{{ for (var item in apnRecords) { }}
							  	{{ if (apnRecords[item].apn != "" && apnRecords[item].apn) { }}				
								<option  {{ if ( apnRecords[item].apn.toLowerCase() == it["apn"]["apn"]["APN_0"]["apn"].toLowerCase() ) {}} selected {{ } }}value="{{=apnRecords[item].apn}}">{{=apnRecords[item].apn}}</option>
								{{ } }}
							{{ } }}
						</select>
				</div>
				<div class="break" id="break_setup_apnAuto_div">
					&nbsp;
				</div>
				<div class="configRow" id="tf1_setup_apnManual_div">
					<label>{{=global_lang["internet_popup"]["apn"] || 'APN' }}</label>
					<input type="text" name="apn" id="tf1_setup_apnManual" maxlength="32" value="{{! it["apn"]["apn"]["APN_0"]["apn"] || "" }}">
				</div>
				<div class="break" id="break_setup_apnManual_div">
					&nbsp;
				</div>
				<div class="configRow">
					<label>{{=global_lang["internet_popup"]["apn_uname"] || 'User Name' }}</label>
					<input type="text"  name="userName" id="tf1_setup_userName" maxlength="32" value='{{! it["apn"]["apn"]["APN_0"]["uname"] || "" }}'>
				</div>
				<div class="break">
					&nbsp;
				</div>
				<div class="configRow" >
					<label>{{=global_lang["internet_popup"]["apn_pwd"] || 'Password' }}</label>
					<input type="password" name="Password" id="tf1_setup_Password" maxlength="32"  value='{{! it["apn"]["apn"]["APN_0"]["passwd"] || "" }}'>
				</div>
				<div class="break">
					&nbsp;
				</div>
				
				 <div class="configRow" id="tf1_apnMethod_div">
						<label>{{=global_lang["internet_popup"]["apn_method"] || 'APN Method' }}</label>
						<select size="1" id="tf1_apnAuth" >
						<option {{ if (it["apn"]["apn"]["APN_0"]["auth"] == "3"){ }} selected {{}}} value="3">{{=global_lang["internet_popup"]["pap&chap"] || 'Auto (PAP & CHAP)' }}</option>                        
							<option {{ if (it["apn"]["apn"]["APN_0"]["auth"] == "1"){ }} selected {{}}} value="1">{{=global_lang["internet_popup"]["pap"] || 'PAP' }}</option>
							<option {{ if (it["apn"]["apn"]["APN_0"]["auth"] == "2"){ }} selected {{}}} value="2">{{=global_lang["internet_popup"]["chap"] || 'CHAP' }}</option>
							<option {{ if (it["apn"]["apn"]["APN_0"]["auth"] == "0"){ }} selected {{}}} value="0">{{=global_lang["internet_popup"]["None"] || 'None' }}</option>                            
                        </select>
					</div>
					<div class="break" id="break_apnMethod_div">
						&nbsp;
					</div>
			
		
			</div>
			<div class="steupWizardBottom">

					<input type="hidden" id="tf1_step" value="2" />
					<input type="button" class="btnSubmit" value='{{=global_lang["setup_wizard"]["next"] || "Next" }}' onclick="setup_apnconfig1Validate()">
                    
				</div>
			</div>
		</div>
		<!-- Screen One Ends--->

							<p><input type="checkbox" onclick="showKey(this)"> {{=global_lang["common"]["show_char"] || 'Show Characters' }}</p>

					<div class="break" id="break_preSharedkey_div">
						&nbsp;

									<th><h6>{{=global_lang["wifi_popup"]["default_key"] || 'Default Key'}}
</h6></th>

										</td>

										<td><a id="tf1_toggle_keyType0" alt="" class="enable-disable2-off" onclick="wifi_keyTypeChange()"></a>

										</td>
									</tr>
									<tr>
										<td>

									  	{{ }else{ }}
										<td><a id="tf1_toggle_keyType1" alt="" class="enable-disable2-on" onclick="wifi_keyTypeChange()"></a>
									  	{{ } }}																					
										<input type="hidden" value="0" name="" >
										</td>
										<td>{{=global_lang["wifi_popup"]["key2"] || 'Key 2'}}</td>

										</td>
									</tr>
									<tr>

										<td><a id="tf1_toggle_keyType2" alt="" class="enable-disable2-on" onclick="wifi_keyTypeChange()"></a>
									  	{{ }else{ }}
										<td><a id="tf1_toggle_keyType2" alt="" class="enable-disable2-off" onclick="wifi_keyTypeChange()"></a>

										</td>
									</tr>
								</tbody>
							</table>
						</div>

				</div>
