
<!-- Wi-Fi Status popUp starts here -->
<div id="tf1_wifiStatus">
<div id="tf1_tmpl_wifistatus_info">
<script id="wifistatusinfoTemplate" type="text/x-dot-template"> 
	<form name="" id="" action="cgi-action.html" method="post">
		<input type="hidden" name="thispage" id="thispage" value="controlPannel.html">
		<h3>{{=global_lang["wifi_popup"]["wifi_status"] || 'Wi-Fi Status' }}</h3>
		<div class="popupContentDisplay">
			<div class="configStatusContent">
				<h4>{{=global_lang["wifi_popup"]["wifi_gen_info"] || 'General Information' }}</h4>

				<div class="configRow2">
					<label>{{=global_lang["wifi_popup"]["wifi_wps"] || 'Wi-Fi  WPS' }}</label>
						{{var str;}}
						{{if (it.wifi2point4 == "1"){ }}
							{{str=global_lang["common"]["on_some"];}}
						{{ } else { }}	
							{{str=global_lang["common"]["off"];}}
						{{ } }}	
					<p class="wps_status">
						{{=str}}
					</p>
				</div>
				<div class="break2">
					&nbsp;
				</div>
				<div class="configRow2">
				<label>{{=global_lang["wifi_popup"]["wifi_2point4"] || 'Wi-Fi 2.4 GHz' }}</label>
					{{  if(it.wifi2point4 == "1") { }}
					<p>
						{{=global_lang["common"]["on"] || 'ON' }}
					</p>
					{{ } else { }}
					<p>
						{{=global_lang["common"]["off"] || 'OFF' }}
					</p>
					{{ } }}
				</div>
				<div class="break2">
					&nbsp;
				</div>
				<div class="configRow2">
					<label>{{=global_lang["wifi_popup"]["cur_clients"] || 'Current Wi-Fi Clients' }}</label>
					<p>
						{{!it.Clientlist || "0"}}
					</p>
				</div>
				<div class="break2">
					&nbsp;
				</div>

				<h4>{{=global_lang["wifi_popup"]["wifi_status"] || 'Wi-Fi Status' }}</h4>
				<div class="break">
					&nbsp;
				</div>
				<div class="blockOne">
					<div class="leftBlock" style="float: none;">
									{{var statuStr;}}
									{{  if(it.wifi2point4 == "1") { }}
										{{statuStr="wifiSignal5";}}
									{{ } else { }}
										{{statuStr="wifiSignal1";}}
									{{ } }}
						<h3 class="wifiHeading"><span class="{{=statuStr}}">&nbsp;</span>{{=global_lang["wifi_popup"]["wifi_2point4"] || 'Wi-Fi 2.4 GHz' }}</h3>
						<div class="blockOneContent">
							<table cellpadding="0" cellspacing="0" border="0"  class="tinytable">

								<tr>
									<td width="50%">{{=global_lang["wifi_popup"]["ssid"] || 'SSID Name' }}</td>
									<td width="50%">{{=it.SSIDname}}</td>
								</tr>
								<tr>
									<td>{{=global_lang["wifi_popup"]["encryption"] || 'Encryption' }}</td>
									<td><span class="wpa_protection">{{=(it.wpaMode || global_lang["wifi_popup"]["basic_protection"])+" - "}}</span>{{=it.cipherType || global_lang["wifi_popup"]["shared"]}}</td>
								</tr>
								<tr>
									<td>{{=global_lang["wifi_popup"]["dhcp"] || 'DHCP' }}</td>
									{{  if(it.dhcp_service == 1) { }}
									<td>{{=global_lang["common"]["on_some"] || 'ON' }}</td>
									{{ } else { }}
									<td>{{=global_lang["common"]["off"] || 'OFF' }}</td>
									{{ } }}
								</tr>
								<tr>
									<td>{{=global_lang["wifi_popup"]["ip_addr"] || 'IP Address' }}</td>
									<td>{{=it.ip_addr}}</td>
								</tr>
								<tr>
									<td>{{=global_lang["wifi_popup"]["subnet"] || 'Subnet' }}</td>
									<td>255.255.255.0</td>
								</tr>
								<tr>
									<td>{{=global_lang["wifi_popup"]["mac_addr"] || 'MAC Address' }}</td>
									<td>{{! it.MacAddr || "  "}}</td>
								</tr>

							</table>
						</div>
					</div>
					 

				</div>
			</div>
		</div>
	</form>
	</script>
	</div>
</div>
