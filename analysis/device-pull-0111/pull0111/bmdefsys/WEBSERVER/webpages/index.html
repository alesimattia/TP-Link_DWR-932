		<script type="text/javascript" charset="utf-8">
			var global_lang = new Object();

			function parseINIString(idata){
			    var regex = {  
				    section: /^\s*\[\s*(.*)\s*\]\s*$/,  
				    keyval: /^\s*([\w\.\-]+)\s*=\s*\x22(.*?)\x22\s*$/,  
				    comment: /^\s*#.*$/   
				};  
				var rtval = {};  
				var lines = idata.split(/\r\n|\r|\n/);  
				var sec = null;  
				var line,matchstr,str2;
				//var replacestr=/[\\\"\\\\]/;
				for(var i=0;i<lines.length;i++)
				{
					line = lines[i];	
					//parse comment "#"				
					if(regex.comment.test(line))
					{  
						continue;  
					}
					//parse keyval
					else if(regex.keyval.test(line))
					{  
						matchstr = line.match(regex.keyval);  
						str2=matchstr[2].replace(/\\\"/,"\"");
						str2=str2.replace(/\\\\/,"\\");
						if(sec)
						{  
							rtval[sec][matchstr[1]] = str2;  
						}
						else
						{  
							rtval[matchstr[1]] = str2;  
						}  
					}
					//parse section
					else if(regex.section.test(line))
					{  
						matchstr = line.match(regex.section);  
						rtval[matchstr[1]] = {};  
						sec = matchstr[1];  
					}
					else if(line.length == 0 && sec)
					{  
						sec = null;  
					}
				}
				return rtval;  
   			}
			
			function uname_str(obj){   
				 var str=obj; 
				 var code;
				 for(var i=0 ; i<str.length; i++){
					code=str.charCodeAt(i);
					if (code == 32 || str.length < 5) {
					  return false;
					}
				}
				return true;
			}
			function usrname_val(usrname){
				if(!uname_str(usrname)){
					$(".user_specification").show();
				}else{
					$(".user_specification").hide();
				}
			}
			
 			function loginValidate() {
				var uname = document.getElementById('tf1_usrName').value;
				var pass = document.getElementById('tf1_password').value;
				/*
				var txtFieldIdArr = new Array();
				txtFieldIdArr[0] = "tf1_userName,Please enter a valid Username";
				txtFieldIdArr[1] = "tf1_password,Please enter a valid Password";

				if (txtFieldArrayCheck(txtFieldIdArr) == false)
					return false;
				*/
				var hashPass = CryptoJS.MD5(pass);
				loginApi_login(uname,hashPass);
			}
			
			function loginInit() {
				var usrObj = document.getElementById('tf1_usrName');
				if (!usrObj)
					return;
				usrObj.focus();
			}
			
			function doSystemNameGet() {		
				var request = $.ajax(
					{
						type: "GET",
						url: "/data.ria?DynUpdate=about_sys",
					dataType: "json"
				});
				request.done(function( responseData,textStatus, jqXHR ) {
					document.title = "D-Link - "+responseData.model_name;
				});
			}	
			/* Start:Language support */	
			var systemData;
			
			$(document).ready(function() {

				HideDialog('tf1_overlay');		 
				doSystemNameGet();
				doget();
			    var request = $.ajax({
			    	url: "/data.ria?FileID=1&sect_name=DEVICE",       
		       		 dataType: "json"
		   		 });
		    	request.done(function( responseData,textStatus, jqXHR ) {  
		    		systemData = responseData["DEVICE"]["language"];
		    	});
		    	request.fail(function( jqXHR, textStatus, errorThrown) {	
		  	  	});
		   	  request.always(function(responseData,textStatus, jqXHR ) {       
		  	  });
		  	  var localeLng = langString(systemData);
		  	  var opts = { language: localeLng, pathPrefix: "/lang"};
					opts.callback = function(data, defaultCallback) {
			          global_lang = data;
			          defaultCallback(data);
			        }
			        $("[data-localize]").localize("lang", opts)
					 
					/*use in scripts as {{=glb_lang["login1"]["welcome"]}} */
			var lang_url = "/lang/lang-"+localeLng+".json";
		    var request = $.ajax({
			    url: lang_url,       
			    dataType: "json"
	   		 });
	    	request.done(function( responseData,textStatus, jqXHR ) {  
	    		global_lang = responseData;
	    	});
	    	request.fail(function( jqXHR, textStatus, errorThrown) {	
	  	  	});
			request.always(function(responseData,textStatus, jqXHR ) {       
			});						
			});
			
	<!--Get login error count-->
	function doget(){
		$.ajax(
		{
			type: "GET",
			url: "/data.ria?CfgType=get_login_time",
			dataType: "text",
			success: function(msgs)
			{
				if(msgs.length > 0)
				{				
					var obj = jQuery.parseJSON(msgs);
					if(obj.login_attempt_count >= 5 && obj.last_error_time <= 60){
						$("#count").show();
						$('#detailTime').text(60 - obj.last_error_time);
						$('#errorTime').text(obj.login_attempt_count);
						setTimeout(function() { 
						  doget();
					   },1000);
					}else{
					   $("#count").hide();
					}
				}
			},
			error: function(xhr, textStatus, errorThrown)
			{
				dialogErrorBox(changeLanguageString("ERROR"));
			}
		});
	}
	
		/* End:Language support */
		
		</script>
