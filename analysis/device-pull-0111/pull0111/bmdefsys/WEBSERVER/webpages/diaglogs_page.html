		    function loginApi_check_auth() {

    if (getCookie("qSessId") == null ) {
       
        alert(global_lang['login1']['session-logout']);
        window.location = "index.html";
        return;
    } else {
        var request = $.ajax({
            url: "login.cgi",
            type: "POST",
            data: { "check_valid" : "qSessId="+getCookie("qSessId")},
            dataType: "json"
        });
        request.done(function( responseData,textStatus, jqXHR ) {     
           
            if(responseData.login_fail){
               
               alert(global_lang['login1']['session-logout']);
               window.location = "index.html";
               return;
            }
            /* Login is failed */
            if(jqXHR.status == 401) {
                
                window.location = "index.html";
                return;
            }
 
            var date = new Date();
            date.setTime(date.getTime() + (24 * 60 * 179 * 1000));
            var expires = ";expires=" + date.toGMTString();
            document.cookie ="DWRLOGGEDTIMEOUT="+179+expires;
         
			        
        });
        request.fail(function( jqXHR, textStatus, errorThrown) {           
              
               alert(global_lang['login1']['session-logout']);
               window.location = "index.html";
               return;
          
        });
        request.always(function(  responseData,textStatus, jqXHR ) {
           
        });
  }

}
			var global_lang = new Object();

			function parseINIString(idata){
			    var regex = {  
				    section: /^\s*\[\s*(.*)\s*\]\s*$/,  
				    keyval: /^\s*([\w\.\-]+)\s*=\s*\x22(.*?)\x22\s*$/,  
				    comment: /^\s*#.*$/   
				};  
				var rtval = {};  
				var lines = idata.split(/\r\n|\r|\n/);  
				var sec = null;  
				var line,matchstr,str2;
				//var replacestr=/[\\\"\\\\]/;
				for(var i=0;i<lines.length;i++)
				{
					line = lines[i];	
					//parse comment "#"				
					if(regex.comment.test(line))
					{  
						continue;  
					}
					//parse keyval
					else if(regex.keyval.test(line))
					{  
						matchstr = line.match(regex.keyval);  
						str2=matchstr[2].replace(/\\\"/,"\"");
						str2=str2.replace(/\\\\/,"\\");
						if(sec)
						{  
							rtval[sec][matchstr[1]] = str2;  
						}
						else
						{  
							rtval[matchstr[1]] = str2;  
						}  
					}
					//parse section
					else if(regex.section.test(line))
					{  
						matchstr = line.match(regex.section);  
						rtval[matchstr[1]] = {};  
						sec = matchstr[1];  
					}
					else if(line.length == 0 && sec)
					{  
						sec = null;  
					}
				}
				return rtval;  
   			}
