              <option value="10" {{ if (it.deepsleeptime == 10){ }} {{#def.selected}} {{}}}>{{=global_lang["system_popup"]["after_10mins"] || 'After 10 Minutes' }} 
              </option>
              <option value="20" {{ if (it.deepsleeptime == 20){ }} {{#def.selected}} {{}}}>{{=global_lang["system_popup"]["after_20mins"] || 'After 20 Minutes' }} 
              </option>
              <option value="30" {{ if (it.deepsleeptime == 30){ }} {{#def.selected}} {{}}}> {{=global_lang["system_popup"]["after_30mins"] || 'After 30 Minutes' }}
              </option>
            </select>
			<p class="textBlock">{{=global_lang["system_popup"]["deep_sleep_info"] || 'System will enter into deep sleep mode, when there is no Internet access from this device.' }}</sp>
          </div>
          <div class="break"  id="break_deepsleepTime_div">&nbsp;</div>
	</form>
